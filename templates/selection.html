{% extends "base.html" %}

{% block content %}

<style>
    .page-wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 60px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2b2b33;
    }

    .page-title {
        text-align: center;
        font-size: 1.8rem;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .page-subtitle {
        text-align: center;
        color: #7a7f92;
        font-size: 0.9rem;
        margin-bottom: 32px;
    }

    .steps {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .field {
        background: #ffffff;
        border: 1px solid #ececf4;
        border-radius: 16px;
        padding: 18px 20px;
        box-shadow: 0 4px 14px rgba(20, 20, 40, 0.05);
        opacity: 0;
        transform: translateY(8px);
        animation: field-in 0.35s ease forwards;
    }

    @keyframes field-in {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .field-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .step-badge {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, #5a6bc4, #8fa6d6);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .field-header label {
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #4a4e60;
    }

    .field select {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        background: #f7f8fc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%235a6bc4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
        border: 1px solid #e1e3ea;
        border-radius: 10px;
        padding: 12px 40px 12px 14px;
        font-size: 0.95rem;
        color: #2b2b33;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field select:focus {
        outline: none;
        border-color: #5a6bc4;
        box-shadow: 0 0 0 3px rgba(90, 107, 196, 0.15);
    }

    .field select:disabled {
        cursor: not-allowed;
        opacity: 0.6;
    }

    .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid #dfe2f0;
        border-top-color: #5a6bc4;
        border-radius: 50%;
        margin-left: auto;
        animation: spin 0.7s linear infinite;
    }

    .spinner.active {
        display: block;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    #pokemon-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    #pokemon-list li {
        background: #eef0fb;
        color: #3d4270;
        padding: 6px 14px 6px 10px;
        border-radius: 999px;
        font-size: 0.85rem;
        text-transform: capitalize;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #pokemon-list li::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #5a6bc4, #8fa6d6);
        flex: none;
    }

    #pokemon-list:empty::after {
        content: "No Pokémon found in this area.";
        color: #9297a8;
        font-size: 0.85rem;
    }

    /* Side-by-Side Flex Layout Container */
    .fields-row {
        display: flex;
        gap: 16px;
        align-items: stretch;
    }

    .fields-row .field {
        flex: 1;
        min-width: 0;
        margin: 0;
    }

    /* Checkbox Group Styles */
    .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
        padding-right: 4px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #f7f8fc;
        border: 1px solid #e1e3ea;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
        font-size: 0.88rem;
        color: #2b2b33;
        user-select: none;
    }

    .checkbox-label:hover {
        background: #eef0fb;
        border-color: #5a6bc4;
    }

    .checkbox-label input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border: 2px solid #5a6bc4;
        border-radius: 4px;
        outline: none;
        cursor: pointer;
        display: grid;
        place-content: center;
        transition: background 0.15s ease;
    }

    .checkbox-label input[type="checkbox"]::before {
        content: "";
        width: 8px;
        height: 8px;
        transform: scale(0);
        transition: 120ms transform ease-in-out;
        box-shadow: inset 1em 1em #fff;
        transform-origin: bottom left;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    .checkbox-label input[type="checkbox"]:checked {
        background-color: #5a6bc4;
    }

    .checkbox-label input[type="checkbox"]:checked::before {
        transform: scale(1);
    }

    /* Stack on smaller mobile screens */
    @media (max-width: 580px) {
        .fields-row {
            flex-direction: column;
        }
    }

    .submit-wrap {
        display: flex;
        justify-content: center;
        margin-top: 8px;
        opacity: 0;
        transform: translateY(8px);
        animation: field-in 0.35s ease forwards;
    }

    #submit-btn {
        appearance: none;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #5a6bc4, #8fa6d6);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 14px 32px;
        border-radius: 999px;
        box-shadow: 0 10px 24px rgba(90, 107, 196, 0.3);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(90, 107, 196, 0.38);
    }

    #submit-btn:active {
        transform: translateY(0);
    }

    #submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }
</style>

<div class="page-wrap">
    <h1 class="page-title">Find a Pokémon</h1>
    <p class="page-subtitle">Narrow it down step by step, then let chance pick your Pokémon.</p>

    <div class="steps">
        <div class="field" id="game-field">
            <div class="field-header">
                <span class="step-badge">1</span>
                <label for="game">Select Pokémon Game</label>
            </div>
            <select name="game" id="game">
                <option value="" selected disabled>-- choose --</option>
                {% for game in games %}
                    <option value="{{ game }}">{{ game }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field" id="region-field" style="display:none;">
            <div class="field-header">
                <span class="step-badge">2</span>
                <label for="region">Select a Region</label>
                <span class="spinner" id="region-spinner"></span>
            </div>
            <select name="region" id="region">
                <option value="" selected disabled>-- choose --</option>
            </select>
        </div>

        <div class="field" id="location-field" style="display:none;">
            <div class="field-header">
                <span class="step-badge">3</span>
                <label for="location">Select Location</label>
                <span class="spinner" id="location-spinner"></span>
            </div>
            <select name="location" id="location">
                <option value="" selected disabled>-- choose --</option>
            </select>
        </div>

        <div class="field" id="area-field" style="display:none;">
            <div class="field-header">
                <span class="step-badge">4</span>
                <label for="area">Select Area</label>
                <span class="spinner" id="area-spinner"></span>
            </div>
            <select name="area" id="area">
                <option value="" selected disabled>-- choose --</option>
            </select>
        </div>

        <!-- Wrapped Step 5 & 6 inside side-by-side flex row -->
        <div class="fields-row" id="pokemon-encounter-row" style="display:none;">
            <div class="field" id="pokemon-area-field">
                <div class="field-header">
                    <span class="step-badge">5</span>
                    <label>Available Pokémon</label>
                    <span class="spinner" id="pokemon-spinner"></span>
                </div>
                <ul id="pokemon-list"></ul>
            </div>

            <div class="field" id="encounter-method-field">
                <div class="field-header">
                    <span class="step-badge">6</span>
                    <label>Select Encounter Method</label>
                </div>
                <div class="checkbox-group" id="encounter-method-list">
                    {% for encounter_method in encounter_methods %}
                        <label class="checkbox-label">
                            <input type="checkbox" name="encounter-method.name" value="{{ encounter_method.value }}" checked>
                            <span>{{ encounter_method.name }}</span>
                        </label>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="submit-wrap" id="submit-wrap" style="display:none;">
            <button type="button" id="submit-btn" style="display:none;">
                Get Random Pokémon
            </button>
        </div>
    </div>
</div>

<script>
    const gameSelect = document.getElementById('game');
    const regionField = document.getElementById('region-field');
    const regionSelect = document.getElementById('region');
    const regionSpinner = document.getElementById('region-spinner');
    const locationField = document.getElementById('location-field');
    const locationSelect = document.getElementById('location');
    const locationSpinner = document.getElementById('location-spinner');
    const areaField = document.getElementById('area-field');
    const areaSelect = document.getElementById('area');
    const areaSpinner = document.getElementById('area-spinner');

    const pokemonEncounterRow = document.getElementById('pokemon-encounter-row');
    const pokemonList = document.getElementById('pokemon-list');
    const pokemonSpinner = document.getElementById('pokemon-spinner');
    const encounterMethodList = document.getElementById('encounter-method-list');
    const submitWrap = document.getElementById('submit-wrap');
    const submitBtn = document.getElementById('submit-btn');

    let currentEncounters = [];

    function formatLabel(text) {
        return text
            .replace(/-/g, ' ')
            .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function formatCheckboxLabel(text) {
        return text
            .toLowerCase()
            .replace(/_/g, ' ')
            .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    document.querySelectorAll('#encounter-method-list span').forEach((span) => {
        if (span.textContent) {
            span.textContent = formatCheckboxLabel(span.textContent);
        }
    });

    document.querySelectorAll('#game option').forEach((option) => {
        if (option.value) {
            option.textContent = formatLabel(option.textContent);
        }
    });

    function fillSelect(selectElement, options) {
        selectElement.innerHTML = '<option value="" selected disabled>-- choose --</option>';
        options.forEach((option) => {
            const optionElement = document.createElement('option');
            if (typeof option === "string") {
                optionElement.value = option;
                optionElement.textContent = formatLabel(option);
            } else {
                optionElement.value = option.id;
                optionElement.textContent = formatLabel(option.name);
            }
            selectElement.appendChild(optionElement);
        });
    }

    function fillList(listElement, options) {
        listElement.innerHTML = '';
        options.forEach((option) => {
            const itemElement = document.createElement('li');
            itemElement.textContent = formatLabel(option.name);
            listElement.appendChild(itemElement);
        });
    }

    // Reads which encounter-method checkboxes are currently checked
    function getSelectedEncounterMethods() {
        return Array.from(
            encounterMethodList.querySelectorAll('input[type="checkbox"]:checked')
        ).map((input) => input.value);
    }

    // Fetches encounters for the currently selected area/game, filtered
    // by whichever encounter methods are checked
    async function loadEncounters() {
        const area = areaSelect.value;
        if (!area) return;

        pokemonList.innerHTML = '';
        pokemonSpinner.classList.add('active');
        submitWrap.style.display = 'none';
        submitBtn.style.display = 'none';

        const game = gameSelect.value;
        const methods = getSelectedEncounterMethods();

        const params = new URLSearchParams({ area, game });
        methods.forEach((method) => params.append('method', method));

        const response = await fetch(`/api/encounters?${params.toString()}`);
        const encounters = await response.json();

        currentEncounters = encounters;
        fillList(pokemonList, encounters);
        pokemonSpinner.classList.remove('active');

        submitWrap.style.display = 'flex';
        submitBtn.style.display = 'inline-block';
    }

    gameSelect.addEventListener('change', async () => {
        const game = gameSelect.value;
        if (!game) return;

        areaField.style.display = 'none';
        pokemonEncounterRow.style.display = 'none';
        submitWrap.style.display = 'none';
        submitBtn.style.display = 'none';
        currentEncounters = [];

        regionField.style.display = 'block';
        regionSelect.disabled = true;
        regionSpinner.classList.add('active');

        const response = await fetch(`/api/regions?game=${game}`);
        const regions = await response.json();

        fillSelect(regionSelect, regions);
        regionSelect.disabled = false;
        regionSpinner.classList.remove('active');
    });

    regionSelect.addEventListener('change', async () => {
        const region = regionSelect.value;
        if (!region) return;

        areaField.style.display = 'none';
        pokemonEncounterRow.style.display = 'none';
        submitWrap.style.display = 'none';
        submitBtn.style.display = 'none';
        currentEncounters = [];

        locationField.style.display = 'block';
        locationSelect.disabled = true;
        locationSpinner.classList.add('active');

        const response = await fetch(`/api/locations?region=${region}`);
        const locations = await response.json();

        fillSelect(locationSelect, locations);
        locationSelect.disabled = false;
        locationSpinner.classList.remove('active');
    });

    locationSelect.addEventListener('change', async () => {
        const location = locationSelect.value;
        if (!location) return;

        pokemonEncounterRow.style.display = 'none';
        submitWrap.style.display = 'none';
        submitBtn.style.display = 'none';
        currentEncounters = [];

        areaField.style.display = 'block';
        areaSelect.disabled = true;
        areaSpinner.classList.add('active');

        const response = await fetch(`/api/areas?location=${encodeURIComponent(location)}`);
        const areas = await response.json();

        fillSelect(areaSelect, areas);
        areaSelect.disabled = false;
        areaSpinner.classList.remove('active');
    });

    areaSelect.addEventListener('change', async () => {
        if (!areaSelect.value) return;

        pokemonEncounterRow.style.display = 'flex';
        await loadEncounters();
    });

    // Re-fetch encounters whenever an encounter-method checkbox is toggled
    encounterMethodList.addEventListener('change', (event) => {
        if (event.target.matches('input[type="checkbox"]')) {
            loadEncounters();
        }
    });

    submitBtn.addEventListener('click', () => {
        if (currentEncounters.length === 0) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Loading...';

        const random = currentEncounters[Math.floor(Math.random() * currentEncounters.length)];

        const params = new URLSearchParams({
            game: gameSelect.selectedOptions[0].text,
            region: regionSelect.selectedOptions[0].text,
            location: locationSelect.selectedOptions[0].text,
            area_name: areaSelect.selectedOptions[0].text,
            area_number: areaSelect.selectedOptions[0].value,
            pokemon_name: random.name
        });

        window.location.href = `/result?${params.toString()}`;
    });
</script>

{% endblock %}
