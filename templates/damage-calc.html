<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damage Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
<div class="page-wrap">
    <h1 class="page-title">Damage Calculator</h1>
    <div class="damage-calc">
        <div class="gen-selection">
            <label for="game">Select Game:</label>
            <select id="game" name="game">
                <option value="" disabled selected hidden>Select Game</option>
                {% for game in games %}
                    <option value="{{ game }}">{{ game }}</option>
                {% endfor %}
            </select>
            <p>You picked: <span id="selected-game"></span></p>
            <p>Available Pokémon: <span id="pokemon-list"></span></p>
        </div>

        <div class="row">
            <div class="col">
                <div class="leftside">
                    <label>Left Pokémon:</label>
                    <div class="pokemon_list">
                        <label for="pokemon_selection_list_left">Select Pokémon:</label>
                        <select id="pokemon_selection_list_left" name="pokemon_selection_list_left">
                            <option value="" disabled selected hidden>Select Pokémon</option>
                        </select>
                        <span id="selected-pokemon-left"></span>
                        <div id="selected-move-left"></div>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="rightside">
                    <label>Right Pokémon:</label>
                    <div class="pokemon_list">
                        <label for="pokemon_selection_list_right">Select Pokémon:</label>
                        <select id="pokemon_selection_list_right" name="pokemon_selection_list_right">
                            <option value="" disabled selected hidden>Select Pokémon</option>
                        </select>
                        <span id="selected-pokemon-right"></span>
                        <div id="selected-move-right"></div>
                    </div>
                </div>
                </div>
            </div>
        </div>

        
    </div>
</div>

<script>

    const pokemonSelectLeft = document.getElementById('pokemon_selection_list_left');
    const pokemonSelectRight = document.getElementById('pokemon_selection_list_right');
    const gameSelect = document.getElementById('game');
    const selectedPokemonLeft = document.getElementById('selected-pokemon-left');
    const selectedPokemonRight = document.getElementById('selected-pokemon-right');

    const leftPokemonData = new Pokemon()
    const rightPokemonData = new Pokemon()

    function Pokemon(name = "Undefined", stats = {}, id = 0, types = [], abilities = [], height = 0, weight = 0, moves = [], selectedMove = "None") {
        this.name = name;
        this.stats = stats;
        this.id = id;
        this.types = types;
        this.abilities = abilities;
        this.height = height;
        this.weight = weight;
        this.moves = moves;
        this.selectedMove = selectedMove;
    }

    function getPokemonData(pokemonName,gameName) {
        return fetch(`/api/pokemon_data?name=${encodeURIComponent(pokemonName)}&game=${encodeURIComponent(gameName)}`)
            .then(response => response.json())
            .then(data => new Pokemon(
                data.name, data.stats, data.id, data.typing, data.abilities, data.height, data.weight, data.moves
            ));
    }

    function getPokemonSprite(pokemonName) {
        return fetch(`/api/pokemon_sprite?name=${encodeURIComponent(pokemonName)}`)
            .then(response => response.json())
            .then(data => data.sprite_url);
    }

    function getPokemonListByGame(game) {
        return fetch(`/api/pokemon_list?game=${encodeURIComponent(game)}`)
            .then(response => response.json())
    }

    function fillPokemonList(pokemonList, selectElement) {
        selectElement.innerHTML = ''; // Clear existing options

        const placeholder = new Option("Select Pokémon", "", true, true);
        placeholder.disabled = true;
        placeholder.hidden = true;
        selectElement.add(placeholder);

        pokemonList.forEach(pokemon => {
            selectElement.add(new Option(pokemon, pokemon));
        });

        selectElement.disabled = false;
        selectElement.selectedIndex = 0;
    }

    async function updatePokemonCard(pokemonName, gameName, cardElementId) {
        const response = await fetch(`/api/pokemon_card?name=${encodeURIComponent(pokemonName)}&game=${encodeURIComponent(gameName)}`);
        const html = await response.text();
        document.getElementById(cardElementId).innerHTML = html;
    }

    async function updateMoveCard(moveName, gameName, cardElementId) {
        const response = await fetch(`/api/move_card?name=${encodeURIComponent(moveName)}&game=${encodeURIComponent(gameName)}`);
        const html = await response.text();
        document.getElementById(cardElementId).innerHTML = html;
    }

    pokemonSelectLeft.addEventListener("change", () => {
        leftPokemonData.selectedMove = null;
        document.getElementById("selected-move-left").replaceChildren();
        getPokemonData(pokemonSelectLeft.value, gameSelect.value).then(pokemon => {
            leftPokemonData.name = pokemon.name;
            leftPokemonData.stats = pokemon.stats;
            leftPokemonData.id = pokemon.id;
            leftPokemonData.types = pokemon.types;
            leftPokemonData.abilities = pokemon.abilities;
            leftPokemonData.height = pokemon.height;
            leftPokemonData.weight = pokemon.weight;
            leftPokemonData.moves = pokemon.moves;
            console.log("Left Pokémon Data:", leftPokemonData);
        });
        updatePokemonCard(pokemonSelectLeft.value, gameSelect.value, 'selected-pokemon-left');
    });

    pokemonSelectRight.addEventListener("change", () => {
        rightPokemonData.selectedMove = null;
        document.getElementById("selected-move-right").replaceChildren();
        getPokemonData(pokemonSelectRight.value, gameSelect.value).then(pokemon => {
            rightPokemonData.name = pokemon.name;
            rightPokemonData.stats = pokemon.stats;
            rightPokemonData.id = pokemon.id;
            rightPokemonData.types = pokemon.types;
            rightPokemonData.abilities = pokemon.abilities;
            rightPokemonData.height = pokemon.height;
            rightPokemonData.weight = pokemon.weight;
            rightPokemonData.moves = pokemon.moves;
            console.log("Right Pokémon Data:", rightPokemonData);
        });
        updatePokemonCard(pokemonSelectRight.value, gameSelect.value, 'selected-pokemon-right');
    });

    gameSelect.addEventListener("change", () => {
        console.log("Selected:", gameSelect.value);
        document.getElementById('selected-game').textContent = gameSelect.value;
        getPokemonListByGame(gameSelect.value).then(pokemonList => {
            console.log("Pokemon List:", pokemonList);
            document.getElementById('pokemon-list').textContent = pokemonList.join(", ");
            fillPokemonList(pokemonList, pokemonSelectLeft);
            fillPokemonList(pokemonList, pokemonSelectRight);
        });
    });

    selectedPokemonLeft.addEventListener("change", (event) => {
        if (!event.target.matches('.move-select')) {
            return
        }
        leftPokemonData.selectedMove = event.target.value;
        console.log("Selected Move (Left):", leftPokemonData.selectedMove);
        updateMoveCard(leftPokemonData.selectedMove, gameSelect.value, 'selected-move-left');
    });

    selectedPokemonRight.addEventListener("change", (event) => {
        if (!event.target.matches('.move-select')) {
            return
        } 
        rightPokemonData.selectedMove = event.target.value;
        console.log("Selected Move (Right):", rightPokemonData.selectedMove);
        updateMoveCard(rightPokemonData.selectedMove, gameSelect.value, 'selected-move-right');
    });

</script>

</body>
