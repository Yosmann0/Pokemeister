<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damage Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
<div class="page-wrap">
    <h1 class="page-title">Damage Calculator</h1>
    <div class="damage-calc">
        <div class="gen-selection">
            <label for="game">Select Game:</label>
            <select id="game" name="game">
                {% for game in games %}
                    <option value="{{ game }}">{{ game }}</option>
                {% endfor %}
            </select>
            <p>You picked: <span id="selected-game"></span></p>
        </div>

        <div class="row">
            <div class="col">
                <div class="leftside">
                    <label for="left_pokemon">Left Pokémon:</label>
                </div>
            </div>
            <div class="col">
                <div class="rightside">
                    <label for="right_pokemon">Right Pokémon:</label>
                </div>
            </div>
        </div>

        <div class="pokemon_list">
            <p>Pokemon List: <span id="pokemon-list"></span></p>
            <label for="pokemon_selection_list">Select Pokémon:</label>
            <select id="pokemon_selection_list" name="pokemon_selection_list"></select>
        </div>
    </div>
</div>

<script>

    // game selection logic
    function getPokemonListByGame(game) {
        return fetch(`/api/pokemon_list?game=${encodeURIComponent(game)}`)
            .then(response => response.json())
    }

    const pokemonSelect = document.getElementById('pokemon_selection_list');
    function fillPokemonList(pokemonList) {
        pokemonSelect.innerHTML = ''; // Clear existing options
        pokemonList.forEach(pokemon => {
            console.log(pokemon)
            pokemonSelect.options.add(new Option(pokemon,pokemon))
        });
    }

    function getSelectedPokemonData() {
        return pokemonSelect.value;
    }

    const gameSelect = document.getElementById('game');
    gameSelect.addEventListener("change", () => {
        console.log("Selected:", gameSelect.value);
        document.getElementById('selected-game').textContent = gameSelect.value;
        getPokemonListByGame(gameSelect.value).then(pokemonList => {
            console.log("Pokemon List:", pokemonList);
            document.getElementById('pokemon-list').textContent = pokemonList.join(", ");
            fillPokemonList(pokemonList)
        });
    });


</script>

</body>
