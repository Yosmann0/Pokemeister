<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damage Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
<div class="page-wrap">
    <h1 class="page-title">Damage Calculator</h1>
    <div class="damage-calc">
        <div class="gen-selection">
            <label for="game">Select Game:</label>
            <select id="game" name="game">
                {% for game in games %}
                    <option value="{{ game }}">{{ game }}</option>
                {% endfor %}
            </select>
            <p>You picked: <span id="selected-game"></span></p>
            <p>Available Pokémon: <span id="pokemon-list"></span></p>
        </div>

        <div class="row">
            <div class="col">
                <div class="leftside">
                    <label>Left Pokémon:</label>
                    <div class="pokemon_list">
                        <label for="pokemon_selection_list_left">Select Pokémon:</label>
                        <select id="pokemon_selection_list_left" name="pokemon_selection_list_left"></select>
                        <span id="selected-pokemon-left"></span>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="rightside">
                    <label>Right Pokémon:</label>
                    <div class="pokemon_list">
                        <label for="pokemon_selection_list_right">Select Pokémon:</label>
                        <select id="pokemon_selection_list_right" name="pokemon_selection_list_right"></select>
                        <span id="selected-pokemon-right"></span>
                    </div>
                </div>
                </div>
            </div>
        </div>

        
    </div>
</div>

<script>

    const pokemonSelectLeft = document.getElementById('pokemon_selection_list_left');
    const pokemonSelectRight = document.getElementById('pokemon_selection_list_right');

    const leftPokemonData = new Pokemon()
    const rightPokemonData = new Pokemon()

    function Pokemon(name = "Undefined", type = "Undefined", baseStats= null, abilities = null) {
        this.name = name;
        this.type = type;
        this.baseStats = baseStats; // { hp: 0, attack: 0, defense: 0, specialAttack: 0, specialDefense: 0, speed: 0 }
        this.moves = [];
        this.abilities = abilities;
    }

    function getPokemonData(pokemonName) {
        return fetch(`/api/pokemon_data?name=${encodeURIComponent(pokemonName)}`)
            .then(response => response.json())
            .then(data => new Pokemon(data.name, data.type, data.base_stats, data.abilities));
    }

    function getPokemonSprite(pokemonName) {
        return fetch(`/api/pokemon_sprite?name=${encodeURIComponent(pokemonName)}`)
            .then(response => response.json())
            .then(data => data.sprite_url);
    }

    // game selection logic
    function getPokemonListByGame(game) {
        return fetch(`/api/pokemon_list?game=${encodeURIComponent(game)}`)
            .then(response => response.json())
    }

    function fillPokemonList(pokemonList, selectElement) {
        selectElement.innerHTML = ''; // Clear existing options
        pokemonList.forEach(pokemon => {
            console.log(pokemon)
            selectElement.options.add(new Option(pokemon,pokemon))
        });
    }

    function updateSelectedPokemonDisplay(selectElement, displayElementId) {
        const selectedPokemon = selectElement.value;
        sprite = getPokemonSprite(selectedPokemon).then(spriteUrl => {
            const imgElement = document.createElement('img');
            imgElement.src = spriteUrl;
            imgElement.alt = selectedPokemon;
            imgElement.classList.add('pokemon-sprite');

            const displayElement = document.getElementById(displayElementId);
            displayElement.innerHTML = ''; // Clear previous content
            displayElement.appendChild(imgElement);
        });
        document.getElementById(displayElementId).textContent = selectedPokemon;
    }

    pokemonSelectLeft.addEventListener("change", () => {
        getPokemonData(pokemonSelectLeft.value).then(pokemon => {
            leftPokemonData.name = pokemon.name;
            leftPokemonData.type = pokemon.type;
            leftPokemonData.baseStats = pokemon.baseStats;
            leftPokemonData.abilities = pokemon.abilities;
            console.log("Left Pokémon Data:", leftPokemonData);
        });
        updateSelectedPokemonDisplay(pokemonSelectLeft, 'selected-pokemon-left');
    });

    pokemonSelectRight.addEventListener("change", () => {
        getPokemonData(pokemonSelectRight.value).then(pokemon => {
            rightPokemonData.name = pokemon.name;
            rightPokemonData.type = pokemon.type;
            rightPokemonData.baseStats = pokemon.baseStats;
            rightPokemonData.abilities = pokemon.abilities;
            console.log("Right Pokémon Data:", rightPokemonData);
        });
        updateSelectedPokemonDisplay(pokemonSelectRight, 'selected-pokemon-right');
    });

    const gameSelect = document.getElementById('game');
    gameSelect.addEventListener("change", () => {
        console.log("Selected:", gameSelect.value);
        document.getElementById('selected-game').textContent = gameSelect.value;
        getPokemonListByGame(gameSelect.value).then(pokemonList => {
            console.log("Pokemon List:", pokemonList);
            document.getElementById('pokemon-list').textContent = pokemonList.join(", ");
            fillPokemonList(pokemonList, pokemonSelectLeft);
            fillPokemonList(pokemonList, pokemonSelectRight);
        });
    });


</script>

</body>
